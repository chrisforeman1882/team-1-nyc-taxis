# yaml-language-server: $schema=bundle_config_schema.json
#
# Databricks Asset Bundle - NYC Yellow Taxi ETL Pipeline
# Deploys a multi-task Workflow that runs Bronze > Silver > Gold notebooks
# in sequence on merge to main.
#
# Usage:
#   databricks bundle validate -t dev
#   databricks bundle deploy  -t dev
#   databricks bundle run     -t dev nyc-taxi-etl
#
# Auth: Set DATABRICKS_HOST and DATABRICKS_TOKEN as environment variables.
# The CLI reads these automatically - do not use variable interpolation
# for workspace.host (not supported for auth fields).

bundle:
  name: nyc-yellow-taxi-etl

variables:
  catalog:
    description: Unity Catalog catalog for all tables
    default: students_data
  schema:
    description: Unity Catalog schema for all tables
    default: chris-foreman
  cluster_id:
    description: Existing cluster ID for running ETL tasks
    default: 0304-150131-r8aga20i

resources:
  jobs:
    nyc-taxi-etl:
      name: "NYC Taxi ETL - ${bundle.target}"
      description: >
        End-to-end ETL pipeline: Bronze ingestion, Silver cleaning & DQ,
        Gold analytics & dashboard tables.
      tags:
        project: nyc-yellow-taxi
        layer: etl
      email_notifications:
        on_failure:
          - chris.foreman@kainos.com
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        # -- Bronze ------------------------------------------------
        - task_key: bronze_ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./notebooks/01_ingest.ipynb
            source: WORKSPACE
          description: "Ingest raw CSV into Bronze Delta table"

        # -- Silver ------------------------------------------------
        - task_key: silver_cleaning
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ./notebooks/02_silver_cleaning.ipynb
            source: WORKSPACE
          description: "Clean, cast, derive columns into Silver Delta table"

        - task_key: silver_dq
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: silver_cleaning
          notebook_task:
            notebook_path: ./notebooks/02_silver_dq.ipynb
            source: WORKSPACE
          description: "Run data quality checks on Silver table"

        # -- Gold --------------------------------------------------
        - task_key: gold_analytics
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: silver_dq
          notebook_task:
            notebook_path: ./notebooks/03_gold_analytics.ipynb
            source: WORKSPACE
          description: "Build Gold fact table, dim_time, dim_location"

        - task_key: gold_dashboard
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: gold_analytics
          notebook_task:
            notebook_path: ./notebooks/03_gold_dashboard.ipynb
            source: WORKSPACE
          description: "Materialise dashboard-ready aggregations"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: students_data
      schema: chris-foreman
      cluster_id: 0304-150131-r8aga20i

  prod:
    mode: production
    variables:
      catalog: students_data
      schema: chris-foreman
      cluster_id: 0304-150131-r8aga20i
    permissions:
      - user_name: chris.foreman@kainos.com
        level: CAN_MANAGE
    run_as:
      user_name: chris.foreman@kainos.com
