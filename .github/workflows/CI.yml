name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for gitleaks full history scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev tooling
        run: |
          pip install ruff detect-secrets pytest pre-commit-hooks pyspark
          pip install -e .

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run detect-secrets
        run: detect-secrets-hook --baseline .secrets.baseline

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=requirements.txt --skip-unresolved

      - name: Run unit tests
        run: |
          pytest tests/test_constants.py \
                 tests/test_transforms.py \
                 tests/test_validators.py \
                 -v

  integration-tests:
    needs: lint-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install databricks-connect pytest
          pip install -e .

      - name: Run INT-01 integration tests
        run: |
          pytest tests/test_int01_bronze.py \
                 tests/test_int01_silver.py \
                 tests/test_int01_gold.py \
                 tests/test_int01_pipeline.py \
                 -v --tb=short
